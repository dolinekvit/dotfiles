# --- Core ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"   # truecolor for nvim
set -g escape-time 10        # kills Esc-lag in nvim
set -g focus-events on       # nvim autoread / focus events work
set -g mouse on              # click, scroll, drag-resize
set -g history-limit 10000

set -g base-index 1          # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on   # no gaps when you close one

# --- Prefix: Ctrl-b -> Ctrl-a ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Splits: keeping current directory ---
# | and - are the "pretty" keys, but on non-US layouts (e.g. Czech) they are
# awkward or unreachable (| is an AltGr combo), so v/b are layout-independent
# aliases that sit on the same physical key everywhere.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"   # side-by-side
bind - split-window -v -c "#{pane_current_path}"   # stacked
bind v split-window -h -c "#{pane_current_path}"   # side-by-side (layout-safe)
bind b split-window -v -c "#{pane_current_path}"   # stacked      (layout-safe)

# --- Move between panes like vim ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- vi keys in copy/scroll mode ---
setw -g mode-keys vi

# --- Reload this config ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# --- bar configuration ---
set -g status-position bottom
set -g status-interval 1
set -g status-left "#{session_name} "
set -g status-right "%H:%M"
set -g status-style 'fg=grey'
set -g window-status-style 'fg=black bg=#BD93F9'

set -g allow-passthrough on # this lets notifications and progress updates reach outer terminal without being swallowed by tmux
set -s extended-keys on # this lets tmux distinguish Shift+Enter from plain Enter so the newline shortcut works
set -as terminal-features 'xterm*:extkeys'
